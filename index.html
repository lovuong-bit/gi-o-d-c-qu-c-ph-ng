<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOÁN 11 • TỔ 1 - GEOGEBRA 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <style>
      body {
        background: #0f172a;
        color: #f1f5f9;
        font-family: system-ui, sans-serif;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(30, 41, 59, 0.7);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .opt {
        transition: all 0.2s;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .opt:hover:not(:disabled) {
        background: rgba(59, 130, 246, 0.1);
        border-color: #3b82f6;
      }
      .opt:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #quiz-node {
        transition: opacity 0.3s ease;
        opacity: 0;
      }
      #wheel-canvas {
        transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        transform: rotate(0deg);
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      .wrong {
        animation: shake 0.2s ease-in-out 0s 2;
        border-color: #ef4444 !important;
        background: rgba(239, 68, 68, 0.1) !important;
      }
      .correct-blink {
        border-color: #22c55e !important;
        background: rgba(34, 197, 94, 0.2) !important;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <header class="sticky top-0 z-50 glass border-b border-white/10 px-4 py-4">
      <div class="max-w-5xl mx-auto flex justify-between items-center gap-3">

          <div
            class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg"
          >
            <i class="fa-solid fa-cube"></i>
          </div>
          <div>
            <h1 class="text-sm md:text-lg font-bold">TOÁN 11 - TỔ 1</h1>
            <p
              class="text-[9px] text-blue-400 font-bold uppercase tracking-tight"
            >
              GeoGebra 3D Quiz
            </p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div
            id="status-bar"
            class="hidden flex gap-2 text-[10px] font-bold uppercase"
          >
            <div class="glass px-2 py-2 rounded-lg">
              CÂU: <span id="current-idx" class="text-blue-400">1</span>/<span
                id="total-q"
                >50</span
              >
            </div>
            <div class="glass px-2 py-2 rounded-lg">
              ĐIỂM: <span id="score-val" class="text-green-400">0.0</span>
            </div>
          </div>
          <button
            onclick="toggleFS()"
            aria-label="Toàn màn hình"
            class="w-10 h-10 flex items-center justify-center rounded-lg glass hover:bg-white/10 transition-colors"
          >
            <i id="fs-icon" class="fa-solid fa-expand text-slate-300"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 md:p-6">
      <div id="start-node" class="py-20 text-center">
        <h2 class="text-4xl font-black mb-8 leading-tight">
          Trắc Nghiệm<br /><span class="text-blue-500">GeoGebra 3D</span>
        </h2>
        <button
          id="start-btn"
          onclick="initGame()"
          class="bg-blue-600 hover:bg-blue-700 px-12 py-5 rounded-2xl text-xl font-bold shadow-xl active:scale-95 transition"
        >
          BẮT ĐẦU
        </button>
      </div>

      <div id="lucky-node" class="hidden py-16 text-center">
        <h3
          class="text-slate-400 mb-6 uppercase font-bold tracking-widest text-sm"
        >
          Người may mắn tiếp theo
        </h3>
        <div
          class="w-36 h-36 rounded-full border-4 border-blue-500/20 bg-blue-500/5 flex items-center justify-center mx-auto mb-10 shadow-2xl shadow-blue-500/10"
        >
          <span id="lucky-val" class="text-6xl font-black text-blue-500"
            >?</span
          >
        </div>
        <button
          id="spin-btn"
          onclick="spinLucky()"
          class="bg-white text-black px-12 py-4 rounded-xl font-bold hover:bg-slate-200 active:scale-95 transition"
        >
          QUAY SỐ
        </button>
      </div>

      <div id="quiz-node" class="hidden">
        <div class="flex gap-2 mb-6">
          <button
            id="t-5050"
            onclick="use5050()"
            class="flex-1 glass p-3 rounded-xl flex flex-col items-center gap-1 active:scale-95"
          >
            <i class="fa-solid fa-scissors text-orange-400"></i
            ><span class="text-[9px] font-bold"
              >50/50 (<span id="c-5050">2</span>)</span
            >
          </button>
          <button
            id="t-gpt"
            onclick="useGPT()"
            class="flex-1 glass p-3 rounded-xl flex flex-col items-center gap-1 active:scale-95"
          >
            <i class="fa-solid fa-robot text-cyan-400"></i
            ><span class="text-[9px] font-bold"
              >GPT (<span id="c-gpt">1</span>)</span
            >
          </button>
          <button
            id="t-help"
            onclick="useHelp()"
            class="flex-1 glass p-3 rounded-xl flex flex-col items-center gap-1 active:scale-95"
          >
            <i class="fa-solid fa-users text-purple-400"></i
            ><span class="text-[9px] font-bold"
              >GIÚP (<span id="c-help">2</span>)</span
            >
          </button>
        </div>
        <div class="glass p-6 md:p-10 rounded-3xl relative">
          <div
            id="q-txt"
            class="text-lg md:text-2xl font-semibold mb-8 leading-relaxed"
          ></div>
          <div id="ans-box" class="grid gap-3"></div>
        </div>
      </div>

      <div id="bonus-node" class="hidden py-10 text-center">
        <h3
          class="text-2xl font-black text-emerald-400 mb-8 uppercase tracking-widest"
        >
          VÒNG QUAY MAY MẮN
        </h3>
        <div class="relative w-72 h-72 mx-auto mb-10">
          <canvas id="wheel-canvas"></canvas>
          <div
            class="absolute -top-5 left-1/2 -translate-x-1/2 text-4xl text-red-500 z-10 drop-shadow-lg"
          >
            ▼
          </div>
        </div>
        <button
          id="bonus-btn"
          onclick="spinBonus()"
          class="bg-emerald-600 px-12 py-4 rounded-2xl font-bold hover:bg-emerald-700 active:scale-95 transition"
        >
          QUAY NGAY
        </button>
      </div>

      <div id="end-node" class="hidden py-20 text-center">
        <div class="text-7xl mb-6">🏆</div>
        <h3 class="text-2xl font-bold mb-2 uppercase">KẾT QUẢ CUỐI CÙNG</h3>
        <div id="final-res" class="text-8xl font-black text-blue-500 mb-10">

        </div>
        <button

        >
          LÀM LẠI TRÒ CHƠI
        </button>
      </div>
    </main>

      let state = {
        idx: 0,
        score: 0,
        lucky: 0,
        tools: { 5050: 2, help: 2, gpt: 1 },
        isAns: false,
        data: [],
        started: false,
      };

      function initGame() {
        if (state.started) return;
        state.started = true;
        state.data = [...dataRaw].sort(() => Math.random() - 0.5);
        document.getElementById("total-q").textContent = state.data.length;
        document.getElementById("start-node").classList.add("hidden");
        document.getElementById("status-bar").classList.remove("hidden");
        showLucky();
      }

      function showLucky() {
        document.getElementById("quiz-node").classList.add("hidden");
        document.getElementById("lucky-node").classList.remove("hidden");
        document.getElementById("lucky-val").textContent = "?";
        document.getElementById("spin-btn").disabled = false;
      }

      function spinLucky() {
        const btn = document.getElementById("spin-btn");
        btn.disabled = true;
        let c = 0;
        let t = setInterval(() => {
          state.lucky = Math.floor(Math.random() * 52) + 1;
          document.getElementById("lucky-val").textContent = state.lucky;
          if (++c > 15) {
            clearInterval(t);
            setTimeout(renderQ, 800);
          }
        }, 50);
      }

      function renderQ() {
        state.isAns = false;
        const qNode = document.getElementById("quiz-node");
        document.getElementById("lucky-node").classList.add("hidden");
        qNode.classList.remove("hidden");
        requestAnimationFrame(() => (qNode.style.opacity = "1"));
        const q = state.data[state.idx];
        document.getElementById("current-idx").textContent = state.idx + 1;
        document.getElementById("q-txt").textContent = q.q;
        const box = document.getElementById("ans-box");
        box.innerHTML = "";
        ["A", "B", "C", "D"].forEach((l) => {
          const btn = document.createElement("button");
          btn.className =
            "opt glass p-4 rounded-xl text-left flex items-center gap-3 text-sm md:text-base";
          btn.innerHTML = `<span class="bg-blue-600 w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-xs">${l}</span> <span>${q[l.toLowerCase()]}</span>`;
          btn.onclick = () => checkAns(l, btn);
          box.appendChild(btn);
        });
        updateTools();
      }

      function checkAns(choice, btn) {
        if (state.isAns) return;
        state.isAns = true;
        const q = state.data[state.idx];
        document.querySelectorAll(".opt").forEach((b) => (b.disabled = true));
        if (choice === q.r) {
          // FIX ĐIỂM: Cộng 0.2 cố định
          state.score = +(state.score + 0.2).toFixed(1);
          document.getElementById("score-val").textContent =
            state.score.toFixed(1);
          btn.classList.add("correct-blink");
          pop("✅ CHÍNH XÁC", `Bạn số ${state.lucky} giỏi quá!`, next);
        } else {
          btn.classList.add("wrong");
          const letters = ["A", "B", "C", "D"];
          const btns = document.querySelectorAll(".opt");
          btns[letters.indexOf(q.r)].classList.add("correct-blink");
          pop("❌ SAI RỒI", `Đáp án đúng là <b>${q.r}</b>`, next);
        }
      }

      function pop(t, b, cb) {
        document.getElementById("quiz-node").style.pointerEvents = "none";
        document.getElementById("m-title").textContent = t;
        document.getElementById("m-body").innerHTML = b;
        document.getElementById("m-btn").onclick = () => {
          cb();
          hidePop();
        };
        document.getElementById("modal-bg").classList.remove("hidden");
      }

      function hidePop() {
        document.getElementById("quiz-node").style.pointerEvents = "auto";
        document.getElementById("modal-bg").classList.add("hidden");
      }

      function next() {
        if (++state.idx >= state.data.length) return finish();
        if (state.idx % 10 === 0) showBonus();
        else showLucky();
      }

      function updateTools() {
        ["5050", "help", "gpt"].forEach((t) => {
          document.getElementById(`c-${t}`).textContent = state.tools[t];
          document.getElementById(`t-${t}`).disabled =
            state.tools[t] <= 0 || state.isAns;
        });
      }

      function use5050() {
        if (state.tools["5050"] <= 0 || state.isAns) return;
        const q = state.data[state.idx];
        const btns = Array.from(document.querySelectorAll("#ans-box button"));
        const activeWrongs = ["A", "B", "C", "D"]
          .map((l, i) => ({ l, i }))
          .filter((item) => item.l !== q.r && !btns[item.i].disabled)
          .sort(() => 0.5 - Math.random());
        if (activeWrongs.length > 0) {
          state.tools["5050"]--;
          updateTools();
          activeWrongs.slice(0, 2).forEach((w) => {
            btns[w.i].disabled = true;
            btns[w.i].style.opacity = "0.3";
          });
        }
      }

      function useGPT() {
        if (state.tools["gpt"] > 0 && !state.isAns) {
          state.tools["gpt"]--;
          updateTools();
          window.open("https://chatgpt.com", "_blank");
        }
      }
      function useHelp() {
        if (state.tools["help"] > 0 && !state.isAns) {
          state.tools["help"]--;
          updateTools();
          pop(
            "🎲 TRỢ GIÚP",
            `Bạn số ${Math.floor(Math.random() * 52) + 1} hỗ trợ nhé!`,
            () => {},
          );
        }
      }

      function showBonus() {
        document.getElementById("quiz-node").classList.add("hidden");
        document.getElementById("bonus-node").classList.remove("hidden");
        const c = document.getElementById("wheel-canvas");
        const ctx = c.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        c.width = 300 * dpr;
        c.height = 300 * dpr;
        c.style.width = "300px";
        c.style.height = "300px";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.scale(dpr, dpr);
        const items = [
          "NỊT",
          "50/50",
          "NỊT",
          "GIÚP",
          "NỊT",
          "GPT",
          "NỊT",
          "GIÚP",
          "NỊT",
          "50/50",
        ];
        const arc = (Math.PI * 2) / 10;
        items.forEach((txt, i) => {
          ctx.beginPath();
          ctx.fillStyle = i % 2 ? "#1e293b" : "#3b82f6";
          ctx.moveTo(150, 150);
          ctx.arc(150, 150, 145, i * arc, (i + 1) * arc);
          ctx.fill();
          ctx.save();
          ctx.translate(150, 150);
          ctx.rotate(i * arc + arc / 2);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(txt, 135, 5);
          ctx.restore();
        });
      }

      function spinBonus() {
        const btn = document.getElementById("bonus-btn");
        if (btn.disabled) return;
        btn.disabled = true;
        const c = document.getElementById("wheel-canvas");
        const deg = 1800 + Math.floor(Math.random() * 360);
        c.style.transition = "transform 5s cubic-bezier(0.15, 0, 0.15, 1)";
        c.style.transform = `rotate(${deg}deg)`;
        setTimeout(() => {
          const final = deg % 360;
          const idx = Math.floor(((360 - final + 270) % 360) / 36);
          const gifts = [
            null,
            "5050",
            null,
            "help",
            null,
            "gpt",
            null,
            "help",
            null,
            "5050",
          ];
          document.getElementById("bonus-node").classList.add("hidden");
          if (gifts[idx]) {
            state.tools[gifts[idx]]++;
            pop("🎁 QUÀ", `Thêm 1 lượt ${gifts[idx].toUpperCase()}`, showLucky);
          } else pop("🤡 ÔI NO", "Vào ô cái nịt rồi!", showLucky);
          btn.disabled = false;
          c.style.transition = "none";
          c.style.transform = "rotate(0deg)";
        }, 5300);
      }

      function finish() {
        document.getElementById("quiz-node").classList.add("hidden");
        document.getElementById("end-node").classList.remove("hidden");
        document.getElementById("final-res").textContent =
          state.score.toFixed(1);
      }

      function toggleFS() {
        if (!document.fullscreenElement)
          document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    </script>
  </body>
</html>
