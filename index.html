        color: #4a5568;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.1);
      }
      .opt {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 3px solid transparent;
        background: white;
        border-radius: 25px;
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.2rem !important;
        font-size: 1.1rem !important;
        font-weight: 600;
      }
      .opt:hover:not(:disabled) {
        transform: translateY(-3px);
        border-color: var(--primary);
        box-shadow: 0 10px 20px rgba(237, 137, 54, 0.2);
      }
      .pachinko-container {
        width: 240px;
        padding: 20px;
        border-radius: 40px;
        background: #111827;
        border: 6px solid var(--primary);
        box-shadow: 0 0 35px rgba(237, 137, 54, 0.4);
      }
      .slot-machine {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .slot-box {
        width: 60px;
        height: 85px;
        background: #1f2937;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 900;
        color: #fbbf24;
        border: 3px solid #374151;
      }
      .spinning {
        color: #374151;
        background: #000;
        filter: blur(1px);
      }

        {

        {

          r: "B",
        },
        {
          q: "Câu 47: Hình dạng hoàn thiện của sản phẩm thực hành là?",
          a: "Một cái kéo",

          c: "Một chiếc điện thoại",
          d: "Chiếc kính đeo mắt 3D",
          r: "D",
        },
        {
          q: "Câu 48: Hai lớp bìa trong mẫu thiết kế có tác dụng?",
          a: "Chống nắng",
          b: "Tạo độ cứng và kẹp mắt kính chắc chắn",
          c: "Vẽ thêm hình",
          d: "Khó hỏng",
          r: "B",
        },
        {
          q: "Câu 49: Khoảng cách 13 cm trên gọng kính nhằm mục đích gì?",
          a: "Chạm vào màn hình",
          b: "Che hết mặt",
          c: "Đảm bảo gọng đủ dài để cài lên tai người dùng",
          d: "Để trang trí",
          r: "C",
        },
        {
          q: "Câu 50: Kết quả cuối cùng học sinh nhận được là?",
          a: "Có kính 3D và hiểu rõ bản chất hình khối không gian",
          b: "Một tờ giấy nháp",
          c: "Một máy tính mới",
          d: "Một bức tranh vẽ tay",
          r: "A",
        },
      ];

      const state = {
        idx: 0,
        scoreInt: 0,
        lucky: 0,
        tools: { 5050: 3, help: 4, gpt: 2 },
        isAns: false,
        modalOpen: false,
        used5050: false,
        pachinkoActive: false,
        isPachinkoRolling: false,
        pachinkoCooldown: false,
        jackpotQueue: 0,
        isShowingBonus: false,
        intervals: { pachinko: null, cooldown: null, activeTimer: null },
        QUESTIONS: [],
      };

      const dom = (id) => document.getElementById(id);

      function initGame() {
        if (dataRaw.length === 0) {
          alert("Vui lòng dán 50 câu hỏi vào dataRaw!");
          return;
        }
        state.QUESTIONS = [...dataRaw].sort(() => Math.random() - 0.5);
        dom("start-node").classList.add("hidden");
        dom("status-bar").classList.remove("hidden");
        showLucky();
      }

      function showLucky() {
        dom("quiz-node").classList.add("hidden");
        dom("lucky-node").classList.remove("hidden");
        dom("lucky-val").textContent = "?";
        dom("spin-btn").disabled = false;
      }

      function spinLucky() {
        const btn = dom("spin-btn");
        if (btn.disabled) return;
        btn.disabled = true;
        let count = 0;
        const t = setInterval(() => {
          state.lucky = Math.floor(Math.random() * 52) + 1;
          dom("lucky-val").textContent = state.lucky;
          if (++count > 20) {
            clearInterval(t);
            setTimeout(renderQ, 600);
          }
        }, 50);
      }

      function renderQ() {
        if (state.idx >= state.QUESTIONS.length) return finish();
        state.isAns = false;
        state.used5050 = false;
        dom("lucky-node").classList.add("hidden");
        dom("quiz-node").classList.remove("hidden");
        dom("q-content").classList.remove("hidden");
        dom("bonus-node").classList.add("hidden");

        const q = state.QUESTIONS[state.idx];
        dom("current-idx").textContent = state.idx + 1;
        dom("q-txt").textContent = q.q;

        const box = dom("ans-box");
        box.innerHTML = "";
        ["A", "B", "C", "D"].forEach((l) => {
          const btn = document.createElement("button");
          btn.className = "opt glass";
          btn.innerHTML = `<span class="bg-orange-500 text-white w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center font-black">${l}</span> <span>${q[l.toLowerCase()]}</span>`;
          btn.onclick = () => checkAns(l, btn);
          box.appendChild(btn);
        });
        updateToolsUI();
      }

      function checkAns(choice, btn) {
        if (state.isAns || state.modalOpen) return;
        state.isAns = true;
        const q = state.QUESTIONS[state.idx];
        const btns = dom("ans-box").querySelectorAll(".opt");
        btns.forEach((b) => (b.disabled = true));

        if (choice === q.r) {
          state.scoreInt += 2;
          dom("score-val").textContent = (state.scoreInt / 10).toFixed(1);
          btn.classList.add("bg-green-100", "border-green-500");
        } else {
          btn.classList.add("bg-red-100", "border-red-500");
          const correctIdx = ["A", "B", "C", "D"].indexOf(q.r);
          btns[correctIdx].classList.add(
            "bg-green-50",
            "border-green-400",
            "ring-2",
            "ring-green-400",
          );
        }

        pop(
          choice === q.r ? "🌟 CHÍNH XÁC" : "🩹 TIẾC QUÁ",
          choice === q.r
            ? `Bạn số ${state.lucky} trả lời rất chuẩn!`
            : `Đáp án đúng phải là <b>${q.r}</b>`,
          () => {
            state.idx++;
            if (state.idx % 10 === 0 && state.idx < 50) {
              showBonus();
            } else if (state.idx >= 50) {
              finish();
            } else {
              showLucky();
            }
          },
        );
      }

      function showBonus() {
        state.isShowingBonus = true;
        dom("q-content").classList.add("hidden");
        dom("bonus-node").classList.remove("hidden");

        const canvas = dom("wheel-canvas");
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        canvas.width = 300 * dpr;
        canvas.height = 300 * dpr;
        canvas.style.width = "250px";
        canvas.style.height = "250px";
        ctx.scale(dpr, dpr);

        const items = [
          "???",
          "???",
          "???",
          "???",
          "???",
          "???",
          "???",
          "???",
          "???",
          "???",
        ];
        const arc = (Math.PI * 2) / 10;

        items.forEach((txt, i) => {
          ctx.beginPath();
          ctx.fillStyle = i % 2 ? "#ffffff" : "#feb47b";
          ctx.moveTo(150, 150);
          ctx.arc(150, 150, 140, i * arc, (i + 1) * arc);
          ctx.fill();
          ctx.strokeStyle = "#4a5568";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.save();
          ctx.translate(150, 150);
          ctx.rotate(i * arc + arc / 2);
          ctx.fillStyle = i % 2 ? "#4a5568" : "#fff";
          ctx.font = "bold 13px sans-serif";
          ctx.textAlign = "right";
          ctx.fillText(txt, 125, 5);
          ctx.restore();
        });
      }

      function spinBonus() {
        const btn = dom("bonus-btn");
        if (btn.disabled) return;
        btn.disabled = true;

        const canvas = dom("wheel-canvas");
        const randomDeg = 1800 + Math.floor(Math.random() * 720);

        canvas.style.transition =
          "transform 5.2s cubic-bezier(0.25, 0.1, 0.25, 1)";
        canvas.style.transform = `rotate(${randomDeg}deg)`;

        setTimeout(() => {
          let deg = randomDeg % 360;
          let idx = Math.floor(((360 - deg + 36) % 360) / 36);

          const gifts = [
            null,
            "5050",
            null,
            "help",
            null,
            "gpt",
            null,
            "help",
            null,
            "5050",
          ];
          const prize = gifts[idx];

          const next = () => {
            closeBonus();
            if (state.idx < 50) showLucky();
            else finish();
          };

          if (prize) {
            state.tools[prize]++;
            pop(
              "🎉 QUÀ TẶNG",
              `Bạn nhận thêm 1 lượt <b>${prize.toUpperCase()}</b>`,
              next,
            );
          } else {
            pop("😢 HẾT QUÀ", "Rất tiếc, bạn quay vào ô <b>CÁI NỊT</b>!", next);
          }

          btn.disabled = false;
          canvas.style.transition = "none";
          canvas.style.transform = "rotate(0deg)";
        }, 5300);
      }

      function closeBonus() {
        state.isShowingBonus = false;
        dom("bonus-node").classList.add("hidden");
        dom("q-content").classList.remove("hidden");
      }

      function pop(t, b, cb) {
        state.modalOpen = true;
        dom("m-title").innerHTML = t;
        dom("m-body").innerHTML = b;
        dom("m-btn").onclick = () => {
          dom("modal-bg").classList.add("hidden");
          state.modalOpen = false;
          if (typeof cb === "function") cb();
        };
        dom("modal-bg").classList.remove("hidden");
      }

      // ==================== PACHINKO ====================
      function togglePachinko() {
        if (state.pachinkoCooldown || state.pachinkoActive) return;
        state.pachinkoActive = true;
        const area = dom("pachinko-area");
        area.classList.remove("hidden");
        setTimeout(() => {
          area.style.opacity = "1";
          area.style.transform = "scale(1)";
        }, 10);
        dom("pachinko-toggle-btn").disabled = true;

        let timeLeft = 30;
        dom("pachinko-active-timer").textContent = `TIME: ${timeLeft}s`;

        state.intervals.activeTimer = setInterval(() => {
          timeLeft--;
          dom("pachinko-active-timer").textContent = `TIME: ${timeLeft}s`;
          if (timeLeft <= 0) stopPachinko();
        }, 1000);

        runPachinkoCycle();
        state.intervals.pachinko = setInterval(() => {
          if (state.pachinkoActive && !state.isPachinkoRolling)
            runPachinkoCycle();
        }, 3500);
      }

      async function runPachinkoCycle() {
        if (!state.pachinkoActive) return;
        state.isPachinkoRolling = true;
        const statusEl = dom("pachinko-status");
        const isEven = (state.idx + 1) % 2 === 0;
        const p = isEven ? 0.18 : 0.09;

        statusEl.textContent = isEven ? "MÁY THƯỜNG: 18%" : "MÁY NHANH: 9%";
        statusEl.style.color = isEven ? "#4ade80" : "#fb7185";

        const nums = Array.from(
          { length: 3 },
          () => Math.floor(Math.random() * 9) + 1,
        );
        const isJackpot = nums[0] === nums[1] && nums[1] === nums[2];

        for (let i = 1; i <= 3; i++) {
          if (!state.pachinkoActive) return;
          const slot = dom(`s${i}`);
          slot.classList.add("spinning");
          let elapsed = 0;
          while (elapsed < 600) {
            slot.textContent = Math.floor(Math.random() * 9) + 1;
            await new Promise((r) => setTimeout(r, 60));
            elapsed += 60;
          }
          slot.classList.remove("spinning");
          slot.textContent = nums[i - 1];
        }

        if (isJackpot) {
          state.jackpotQueue++;
          statusEl.textContent = "🔥 JACKPOT! 🔥";
          setTimeout(checkAndTriggerBonus, 800);
        }
        state.isPachinkoRolling = false;
      }

      function stopPachinko() {
        state.pachinkoActive = false;
        clearInterval(state.intervals.activeTimer);
        clearInterval(state.intervals.pachinko);
        const area = dom("pachinko-area");
        area.style.opacity = "0";
        area.style.transform = "scale(0.9)";
        setTimeout(() => {
          area.classList.add("hidden");
          dom("pachinko-status").textContent = "READY";
          dom("pachinko-status").style.color = "white";
          startCooldown();
        }, 500);
      }

      function startCooldown() {
        state.pachinkoCooldown = true;
        let sec = 180;
        dom("pachinko-timer").classList.remove("hidden");
        state.intervals.cooldown = setInterval(() => {
          sec--;
          dom("cooldown-val").textContent =
            `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`;
          if (sec <= 0) {
            clearInterval(state.intervals.cooldown);
            state.pachinkoCooldown = false;
            dom("pachinko-toggle-btn").disabled = false;
            dom("pachinko-timer").classList.add("hidden");
          }
        }, 1000);
      }

      function checkAndTriggerBonus() {
        if (
          state.jackpotQueue > 0 &&
          !state.modalOpen &&
          !state.isShowingBonus &&
          !dom("quiz-node").classList.contains("hidden")
        ) {
          state.jackpotQueue--;
          pop(
            "🎰 JACKPOT TỔ 2!",
            "Nổ hũ thành công! Quay quà ngay nào.",
            showBonus,
          );
        }
      }

      function updateToolsUI() {
        ["5050", "help", "gpt"].forEach((t) => {
          dom(`c-${t}`).textContent = state.tools[t];
          dom(`t-${t}`).disabled =
            state.tools[t] <= 0 ||
            state.isAns ||
            (t === "5050" && state.used5050);
        });
      }

      function use5050() {
        if (state.tools["5050"] <= 0 || state.isAns || state.used5050) return;
        state.tools["5050"]--;
        state.used5050 = true;
        const q = state.QUESTIONS[state.idx];
        const btns = Array.from(dom("ans-box").querySelectorAll("button"));
        const wrongs = ["A", "B", "C", "D"]
          .map((l, i) => ({ l, i }))
          .filter((it) => it.l !== q.r)
          .sort(() => Math.random() - 0.5);
        wrongs.slice(0, 2).forEach((w) => {
          btns[w.i].disabled = true;
          btns[w.i].style.opacity = "0.2";
        });
        updateToolsUI();
      }

      function useGPT() {
        if (state.tools["gpt"] > 0 && !state.isAns) {
          state.tools["gpt"]--;
          updateToolsUI();
          window.open("https://chatgpt.com", "_blank");
        }
      }

      function useHelp() {
        if (state.tools["help"] > 0 && !state.isAns) {
          state.tools["help"]--;
          updateToolsUI();
          pop(
            "🎈 TRỢ GIÚP",
            `Mời bạn số <b>${Math.floor(Math.random() * 52) + 1}</b> trợ giúp!`,
            () => {},
          );
        }
      }

      function finish() {
        Object.values(state.intervals).forEach((i) => clearInterval(i));
        dom("quiz-node").classList.add("hidden");
        dom("end-node").classList.remove("hidden");
        dom("final-res").textContent = (state.scoreInt / 10).toFixed(1);
      }
    </script>
